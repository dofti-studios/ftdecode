name: Dependency security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install cargo-audit
        working-directory: ${{ runner.temp }}
        run: cargo +1.98.0 install cargo-audit --version 0.23.0 --locked
      - name: Audit locked dependencies
        working-directory: ${{ runner.temp }}
        run: cargo +1.98.0 audit --file "$GITHUB_WORKSPACE/Cargo.lock" --deny warnings
